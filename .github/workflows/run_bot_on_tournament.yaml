name: Forecast on new AI tournament questions

on:
  workflow_dispatch:
  schedule:
    - cron: "7,27,47 * * * *" # every 20 min, offset off the hour. Make sure to skip already-forecasted questions!

# Add concurrency group to prevent parallel runs
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# Runs the bot on the live FutureEval tournament + MiniBench.
# Safety rails: skips cleanly if the two secrets are missing, enforces the
# per-run / per-day spend caps (the daily ledger is carried between runs with
# the Actions cache), and writes a short job summary on every run.
jobs:
  forecast_job:
    runs-on: ubuntu-latest # determines the machine that will run the job - keep as is
    timeout-minutes: 50
    steps: # sets up the steps that will be run in order
      - name: Check that the two required secrets exist
        id: secrets
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          missing=""
          if [ -z "$METACULUS_TOKEN" ]; then missing="$missing METACULUS_TOKEN"; fi
          if [ -z "$ANTHROPIC_API_KEY" ]; then missing="$missing ANTHROPIC_API_KEY"; fi
          if [ -n "$missing" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "## ⏭️ Bot not configured yet"
              echo
              echo "Missing repository secret(s):$missing"
              echo
              echo "Add them under **Settings → Secrets and variables → Actions → New repository secret** (see SETUP-FOR-MAX.md). Nothing was run and nothing was spent."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Missing repository secret(s):$missing. Skipping this run. See SETUP-FOR-MAX.md"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # setup repository with all necessary dependencies - keep as is
      - name: Check out repository
        if: steps.secrets.outputs.configured == 'true'
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: steps.secrets.outputs.configured == 'true'
        with:
          python-version: "3.11"
      - name: Install poetry
        if: steps.secrets.outputs.configured == 'true'
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      - name: Install dependencies
        if: steps.secrets.outputs.configured == 'true'
        run: poetry install --no-interaction --no-root --without dev

      # The spend ledger remembers how much was spent today (UTC) across runs
      # so the per-day cap holds. Each run restores the newest ledger and
      # saves its own copy under a fresh key.
      - name: Restore spend ledger (daily cap memory)
        if: steps.secrets.outputs.configured == 'true'
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: .spend
          key: spend-ledger-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            spend-ledger-

      - name: Run bot
        if: steps.secrets.outputs.configured == 'true'
        run: |
          poetry run python main.py --mode tournament
        # Secrets: Settings --> Secrets and variables --> Actions --> Secrets.
        # Tuning:  Settings --> Secrets and variables --> Actions --> Variables
        #          (all optional; unset means the defaults in bot_config.py).
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BOT_MAIN_MODEL: ${{ vars.BOT_MAIN_MODEL }}
          BOT_FALLBACK_MODEL: ${{ vars.BOT_FALLBACK_MODEL }}
          BOT_EFFORT: ${{ vars.BOT_EFFORT }}
          BOT_RESEARCH_MODE: ${{ vars.BOT_RESEARCH_MODE }}
          BOT_MAX_COST_PER_RUN_USD: ${{ vars.BOT_MAX_COST_PER_RUN_USD }}
          BOT_MAX_COST_PER_DAY_USD: ${{ vars.BOT_MAX_COST_PER_DAY_USD }}
          BOT_PREDICTIONS_PER_QUESTION: ${{ vars.BOT_PREDICTIONS_PER_QUESTION }}
          BOT_PUBLISH: ${{ vars.BOT_PUBLISH }}

      - name: Save spend ledger
        if: always() && steps.secrets.outputs.configured == 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: .spend
          key: spend-ledger-${{ github.run_id }}-${{ github.run_attempt }}
