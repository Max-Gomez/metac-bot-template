name: Tests (no API calls)

on:
  push:
  pull_request:
  workflow_dispatch:

# Unit + end-to-end tests with the LLM and Metaculus boundaries faked and the
# network blocked. Needs no secrets and spends nothing.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      - name: Install dependencies
        run: poetry install --no-interaction --no-root --without dev
      - name: Install test runner
        run: poetry run pip install --quiet "pytest>=8,<9" "pytest-asyncio>=1,<2"
      - name: Run tests
        run: poetry run pytest -q
